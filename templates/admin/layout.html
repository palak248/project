<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Administration{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="admin-header site-header">
        <nav class="admin-nav" aria-label="Primary navigation">
            <a class="brand" href="{{ url_for('admin.dashboard') }}">Student Performance</a>
            <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('admin.students') }}">Students</a>
            <a href="{{ url_for('admin.teachers') }}">Teachers</a>
            <a href="{{ url_for('admin.classes') }}">Classes</a>
            <a href="{{ url_for('admin.subjects') }}">Subjects</a>
            <a href="{{ url_for('admin.assignments') }}">Assignments</a>
            <form method="post" action="{{ url_for('auth.logout') }}">
                <button type="submit">Log out</button>
            </form>
        </nav>
    </header>
    <main class="page-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}<div class="flash-stack" aria-live="polite" aria-atomic="true">
                {% for category, message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}
            </div>{% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
