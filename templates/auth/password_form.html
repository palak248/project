<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="page-shell auth-shell">
        <section class="auth-card" aria-labelledby="password-title">
            <a class="back-link" href="{{ url_for('home') }}">&larr; Home</a>
            <p class="eyebrow">Account security</p>
            <h1 id="password-title">Change password</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}<div class="flash-stack" aria-live="polite" aria-atomic="true">
                    {% for category, message in messages %}<p class="message {{ category }}">{{ message }}</p>{% endfor %}
                </div>{% endif %}
            {% endwith %}
            <form class="record-form" method="post" action="{{ url_for('auth.password') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="current-password">Current password</label>
                <input id="current-password" name="current_password" type="password" autocomplete="current-password" required autofocus>

                <label for="new-password">New password</label>
                <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>

                <label for="password-confirmation">Confirm new password</label>
                <input id="password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required>

                <button type="submit">Change password</button>
            </form>
        </section>
    </main>
</body>
</html>
